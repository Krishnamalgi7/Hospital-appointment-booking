<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Hospitum Core</title>
  <meta name="description" content="Secure login and registration portal for the Hospital Appointment Booking System." />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { padding: 0; margin: 0; overflow: hidden; }

    /* ── Fullscreen Background ── */
    .auth-layout-fullscreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      background-image: url('assets/bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 0 10%;
      transition: background 0.3s ease;
    }

    /* Dark overlay on background — lighter in light mode */
    .auth-layout-fullscreen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 1;
      transition: background 0.3s ease;
    }
    /* Light mode: lighter overlay so bg image shows nicely */
    :root:not([data-theme="dark"]) .auth-layout-fullscreen::before {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ── Auth Card ── */
    .auth-card-centered {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      /* Dark mode: glassmorphism */
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: var(--radius-lg);
      padding: 48px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    /* Light mode: clean white card */
    :root:not([data-theme="dark"]) .auth-card-centered {
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 4px 16px rgba(0, 0, 0, 0.08);
      backdrop-filter: none;
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Left text (always white — it's over the bg image) ── */
    .auth-text-left {
      position: relative;
      z-index: 2;
      color: #fff;
      max-width: 500px;
      text-align: left;
    }
    .auth-text-left h1 {
      font-size: 3rem; font-weight: 700; color: #fff;
      margin-bottom: 16px; line-height: 1.2;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .auth-text-left p {
      font-size: 1.15rem; color: rgba(255,255,255,0.92);
      line-height: 1.6; text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    /* ── Tabs ── */
    .auth-tabs {
      display: flex; gap: 8px; margin-bottom: 32px;
      background: rgba(255,255,255,0.06);
      padding: 4px;
      border-radius: var(--radius-sm);
      transition: background 0.3s;
    }
    :root:not([data-theme="dark"]) .auth-tabs {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
    }
    .auth-tab-btn {
      flex: 1; padding: 10px; border: none; background: transparent;
      color: var(--text-secondary);
      font-weight: 500; font-size: 0.9rem; font-family: 'Inter', sans-serif;
      cursor: pointer; border-radius: 4px; transition: all var(--transition);
    }
    .auth-tab-btn:hover { color: var(--text-primary); }
    .auth-tab-btn.active {
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    /* Active tab in dark mode needs explicit bg */
    [data-theme="dark"] .auth-tab-btn.active {
      background: #334155;
    }

    .auth-form { display: none; animation: fadeIn 0.3s ease; }
    .auth-form.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Floating inputs — force text + border colour inside card ── */
    .auth-card-centered .form-floating input,
    .auth-card-centered .form-floating select,
    .auth-card-centered .form-floating textarea {
      background: transparent;
      color: var(--text-primary);
      border-color: var(--border);
    }
    /* Light mode: give inputs a very subtle bg so they stand out on white card */
    :root:not([data-theme="dark"]) .auth-card-centered .form-floating input,
    :root:not([data-theme="dark"]) .auth-card-centered .form-floating select {
      background: var(--bg-secondary);
      border-color: var(--border);
      color: var(--text-primary);
    }
    :root:not([data-theme="dark"]) .auth-card-centered .form-floating input:focus,
    :root:not([data-theme="dark"]) .auth-card-centered .form-floating input:not(:placeholder-shown) {
      background: #fff;
    }
    /* Dark mode: keep transparent (over dark card it works fine) */
    [data-theme="dark"] .auth-card-centered .form-floating input,
    [data-theme="dark"] .auth-card-centered .form-floating select {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.12);
      color: #f1f5f9;
    }
    [data-theme="dark"] .auth-card-centered .form-floating input:focus,
    [data-theme="dark"] .auth-card-centered .form-floating input:not(:placeholder-shown) {
      border-color: var(--accent-primary);
    }
    /* Labels */
    :root:not([data-theme="dark"]) .auth-card-centered .form-floating label {
      color: var(--text-muted);
    }
    [data-theme="dark"] .auth-card-centered .form-floating label {
      color: #64748b;
    }

    .eye-btn {
      position: absolute; right: 14px; top: 18px;
      background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem;
    }
    .form-footer { margin-top: 24px; text-align: center; color: var(--text-secondary); font-size: 0.9rem; }
    #alert-box { margin-bottom: 20px; }
    .alert { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.9rem; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .alert-error { background: rgba(220,38,38,0.08); border: 1px solid rgba(220,38,38,0.2); color: var(--danger); }
    .alert-success { background: rgba(5,150,105,0.08); border: 1px solid rgba(5,150,105,0.2); color: var(--success); }

    /* ── Gender select (register form) ── */
    #register-form select {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      width: 100%; height: 100%; padding: 22px 16px 8px;
      font-size: 0.95rem; font-family: 'Inter', sans-serif;
      outline: none; appearance: none;
    }
    [data-theme="dark"] #register-form select {
      background: rgba(255,255,255,0.04);
      color: #f1f5f9;
      border-color: rgba(255,255,255,0.12);
      color-scheme: dark;
    }
    #register-form select option {
      background: var(--bg-card);
      color: var(--text-primary);
    }
    [data-theme="dark"] #register-form select option {
      background: #1e293b;
      color: #f1f5f9;
    }

    /* ── Theme toggle on auth page ── */
    .auth-theme-toggle-btn {
      backdrop-filter: blur(8px);
      background: rgba(255,255,255,0.18) !important;
      border-color: rgba(255,255,255,0.3) !important;
      color: #fff !important;
    }
    :root:not([data-theme="dark"]) .auth-theme-toggle-btn {
      background: rgba(255,255,255,0.85) !important;
      border-color: var(--border) !important;
      color: var(--text-primary) !important;
    }
  </style>

  <script src="js/theme.js"></script>
</head>
<body>

  <div id="toast-container"></div>

  <!-- Theme toggle: fixed top-right on auth page -->
  <div class="auth-theme-toggle">
    <button class="theme-toggle auth-theme-toggle-btn" onclick="toggleTheme()" title="Switch theme">
      <span class="toggle-icon">🌙</span>
      <span class="toggle-label">Dark</span>
    </button>
  </div>

  <div class="auth-layout-fullscreen">
    
    <div class="auth-text-left">
      <h1>Hospitum Core</h1>
      <p>The enterprise-grade hospital management and patient scheduling platform designed for modern healthcare.</p>
    </div>

    <div class="auth-card-centered" style="margin: 0;">

      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab-btn" id="tab-register" onclick="switchTab('register')">Create Account</button>
      </div>

      <div id="alert-box"></div>

      <!-- ── Login Form ──────────────────────────────────────────────────── -->
      <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="form-floating">
          <input type="email" id="login-email" placeholder=" " required autocomplete="email" />
          <label for="login-email">Email Address</label>
        </div>
        <div class="form-floating">
          <input type="password" id="login-password" placeholder=" " required autocomplete="current-password" />
          <label for="login-password">Password</label>
          <button type="button" class="eye-btn" onclick="togglePw('login-password', this)">👁</button>
        </div>

        <button type="submit" class="btn btn-primary btn-full mt-4" id="login-btn" style="padding: 14px; font-size: 1rem; font-weight: 600;">
          Sign In
        </button>

        <div class="form-footer">
          Don't have an account? <a href="#" onclick="switchTab('register'); return false;" style="color: var(--accent-primary); font-weight: 500;">Register here</a>
        </div>
      </form>

      <!-- ── Register Form ───────────────────────────────────────────────── -->
      <form id="register-form" class="auth-form" onsubmit="handleRegister(event)" style="max-height: 62vh; overflow-y: auto; padding-right: 4px;">
        <div class="form-floating">
          <input type="text" id="reg-name" placeholder=" " required autocomplete="name" />
          <label for="reg-name">Full Name</label>
        </div>
        <div class="form-floating">
          <input type="email" id="reg-email" placeholder=" " required autocomplete="email" />
          <label for="reg-email">Email Address</label>
        </div>

        <!-- Age + Gender grid row -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-floating">
            <input type="number" id="reg-age" placeholder=" " min="1" max="120" required />
            <label for="reg-age">Age</label>
          </div>
          <div class="form-floating">
            <select id="reg-gender" required style="appearance: none; cursor: pointer;">
              <option value="" disabled selected hidden></option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
            <label for="reg-gender" style="pointer-events: none;">Gender</label>
          </div>
        </div>

        <div class="form-floating">
          <input type="tel" id="reg-phone" placeholder=" " pattern="[0-9+\-\s]{7,15}" required autocomplete="tel" />
          <label for="reg-phone">Phone Number</label>
        </div>
        <div class="form-floating">
          <input type="password" id="reg-password" placeholder=" " required minlength="6" autocomplete="new-password" />
          <label for="reg-password">Password (Min 6 chars)</label>
          <button type="button" class="eye-btn" onclick="togglePw('reg-password', this)">👁</button>
        </div>
        <div class="form-floating">
          <input type="password" id="reg-confirm" placeholder=" " required autocomplete="new-password" />
          <label for="reg-confirm">Confirm Password</label>
          <button type="button" class="eye-btn" onclick="togglePw('reg-confirm', this)">👁</button>
        </div>

        <button type="submit" class="btn btn-primary btn-full mt-4" id="register-btn" style="padding: 14px; font-size: 1rem; font-weight: 600;">
          Create Patient Account
        </button>

        <div class="form-footer">
          Already have an account? <a href="#" onclick="switchTab('login'); return false;" style="color: var(--accent-primary); font-weight: 500;">Sign In</a>
        </div>
      </form>


    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
