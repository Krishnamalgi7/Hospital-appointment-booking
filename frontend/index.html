<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Appointment Booking — Login</title>
  <meta name="description" content="Secure login and registration portal for the Hospital Appointment Booking System." />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* ── Auth Page Specific ─────────────────────────────────────────────── */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    /* Brand at top */
    .auth-brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .auth-brand-icon {
      width: 64px; height: 64px;
      background: var(--accent-grad);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 14px;
      box-shadow: 0 8px 32px rgba(14,165,233,0.4);
      animation: iconPulse 3s ease-in-out infinite;
    }
    @keyframes iconPulse {
      0%,100% { box-shadow: 0 8px 32px rgba(14,165,233,0.4); }
      50%      { box-shadow: 0 8px 48px rgba(14,165,233,0.65); }
    }
    .auth-brand h1 {
      font-size: 1.9rem;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .auth-brand p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Card */
    .auth-card {
      padding: 36px 32px;
    }

    /* Tab switcher */
    .auth-tabs {
      display: flex;
      margin-bottom: 28px;
      background: rgba(255,255,255,0.04);
      border-radius: var(--radius-md);
      padding: 4px;
      border: 1px solid var(--border);
    }
    .auth-tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }
    .auth-tab-btn.active {
      background: var(--accent-grad);
      color: #fff;
      box-shadow: 0 2px 12px rgba(14,165,233,0.3);
    }

    .auth-form { display: none; }
    .auth-form.active { display: block; animation: fadeInUp 0.3s ease; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .form-footer {
      text-align: center;
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .form-footer a {
      color: var(--accent-1);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .form-footer a:hover { text-decoration: underline; }

    #alert-box { margin-bottom: 16px; }

    /* Password eye toggle */
    .input-wrap { position: relative; }
    .input-wrap input { padding-right: 44px; }
    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      transition: color var(--transition);
    }
    .eye-btn:hover { color: var(--accent-1); }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div id="toast-container"></div>

  <div class="auth-wrapper">
    <!-- Brand -->
    <div class="auth-brand">
      <div class="auth-brand-icon">🏥</div>
      <h1>MediCare Portal</h1>
      <p>Your health, our priority</p>
    </div>

    <!-- Card -->
    <div class="glass-card auth-card">
      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tab-login"    onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab-btn"        id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Alert box -->
      <div id="alert-box"></div>

      <!-- ── Login Form ──────────────────────────────────────────────────── -->
      <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="doctor@hospital.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrap">
            <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="eye-btn" onclick="togglePw('login-password', this)">👁</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          Sign In
        </button>

        <div class="form-footer">
          No account? <a onclick="switchTab('register')">Register as Patient</a>
        </div>
      </form>

      <!-- ── Register Form ───────────────────────────────────────────────── -->
      <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" placeholder="John Doe" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <div class="input-wrap">
            <input type="password" id="reg-password" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password" />
            <button type="button" class="eye-btn" onclick="togglePw('reg-password', this)">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-confirm">Confirm Password</label>
          <div class="input-wrap">
            <input type="password" id="reg-confirm" placeholder="Repeat your password" required autocomplete="new-password" />
            <button type="button" class="eye-btn" onclick="togglePw('reg-confirm', this)">👁</button>
          </div>
        </div>

        <div class="divider">Patient registration only</div>

        <button type="submit" class="btn btn-primary btn-full" id="register-btn">
          Create Account
        </button>

        <div class="form-footer">
          Already have an account? <a onclick="switchTab('login')">Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
