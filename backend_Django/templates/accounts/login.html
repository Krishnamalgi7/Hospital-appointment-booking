{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1 class="auth-title">
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Login to continue
        </p>

        {% if form.errors %}

        <div class="error-box">

            Invalid credentials
        </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-btn">
                Login
            </button>

        </form>

        <div class="auth-link">

            Don’t have an account?

            <a href="{% url 'register' %}">
                Register
            </a>

        </div>

    </div>

</div>

{% endblock %}
