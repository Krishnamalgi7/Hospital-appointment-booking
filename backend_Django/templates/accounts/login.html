{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

{% if form.errors %}

<div style="color:red;">

    {{ form.errors }}

</div>

{% endif %}
<h1>Login</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Login
    </button>

</form>

<a href="{% url 'register' %}">
    Register
</a>

{% endblock %}
