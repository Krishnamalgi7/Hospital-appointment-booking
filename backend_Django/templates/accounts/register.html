{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1 class="auth-title">
            Hospitum Core
        </h1>

        <p class="auth-subtitle">
            Create your patient account
        </p>

        {% if form.errors %}

        <div class="error-box">

            {{ form.errors }}

        </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-btn">
                Register
            </button>

        </form>

        <div class="auth-link">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
