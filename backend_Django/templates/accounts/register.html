{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}

{% if form.errors %}

<div style="color:red;">

    {{ form.errors }}

</div>

{% endif %}
<h1>Patient Registration</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Register
    </button>

</form>

<a href="{% url 'login' %}">
    Login
</a>

{% endblock %}
